name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.12.1"

jobs:
  static-quality:
    name: Static quality gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install lightweight test dependencies
        run: uv pip install --system 'pytest>=8.4,<9' 'PyYAML==6.0.3'

      - name: Python syntax
        run: python -m compileall -q agent acceptance ingestion lakehouse metadata mcp_server orchestration serving tests scripts

      - name: Shell syntax
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f -name '*.sh' -print0)

      - name: YAML and JSON syntax
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          excluded = {'.git', '.runtime', '.venv', 'target', 'logs'}
          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in excluded for part in path.parts):
                  continue
              if path.suffix in {'.yml', '.yaml'}:
                  yaml.safe_load(path.read_text(encoding='utf-8'))
              elif path.suffix == '.json':
                  json.loads(path.read_text(encoding='utf-8'))
          PY

      - name: Source comment and CI policy contracts
        run: pytest -q tests/test_source_comment_contract.py tests/test_ci_dependency_lock_contract.py

      - name: Metric version lifecycle governance
        run: |
          python metadata/datahub/tools/validate_metric_lifecycle.py
          pytest -q tests/test_metric_version_lifecycle_contract.py

      - name: Validate committed lock set if present
        run: python scripts/check_dependency_locks.py

  contract-suite:
    name: Full static contract suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Resolve or reuse CI dependency lock
        shell: bash
        run: |
          if [[ -f requirements/locks/ci-py311-linux.lock.txt ]]; then
            echo "CI_LOCK=requirements/locks/ci-py311-linux.lock.txt" >> "$GITHUB_ENV"
          else
            LOCK_OUTPUT_DIR=.ci-locks ./scripts/lock_dependencies.sh ci
            echo "CI_LOCK=.ci-locks/ci-py311-linux.lock.txt" >> "$GITHUB_ENV"
          fi

      - name: Install CI environment from hash lock
        run: uv pip install --system -r "$CI_LOCK"

      - name: Run all source/static contracts
        run: pytest -q

  redis-runtime-acceptance:
    name: Real Redis runtime acceptance
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7.4.0-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      AGENT_REDIS_RUNTIME_ACCEPTANCE: "true"
      AGENT_API_TRAFFIC_BACKEND: redis
      AGENT_API_REDIS_URL: redis://127.0.0.1:6379/0
      AGENT_API_REDIS_NAMESPACE: commerce:agent:acceptance:${{ github.run_id }}
      AGENT_API_REDIS_OPERATION_TIMEOUT_SECONDS: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Resolve or reuse CI dependency lock
        shell: bash
        run: |
          if [[ -f requirements/locks/ci-py311-linux.lock.txt ]]; then
            echo "CI_LOCK=requirements/locks/ci-py311-linux.lock.txt" >> "$GITHUB_ENV"
          else
            LOCK_OUTPUT_DIR=.ci-locks ./scripts/lock_dependencies.sh ci
            echo "CI_LOCK=.ci-locks/ci-py311-linux.lock.txt" >> "$GITHUB_ENV"
          fi

      - name: Install base CI environment from hash lock
        run: uv pip install --system -r "$CI_LOCK"

      - name: Resolve Redis runtime dependency hash lock
        env:
          LOCK_OUTPUT_DIR: .ci-locks
        run: ./scripts/lock_dependencies.sh agent-redis

      - name: Install Redis runtime client from hash lock
        run: uv pip install --system -r .ci-locks/agent-redis-py311-linux.lock.txt

      - name: Run real Redis runtime acceptance
        run: |
          mkdir -p .runtime/ci
          pytest -q tests/runtime/test_agent_redis_runtime_acceptance.py \
            --junitxml=.runtime/ci/redis-runtime-acceptance.xml

      - name: Run bounded Redis load smoke
        run: |
          python scripts/run_agent_redis_load.py \
            --profile ci-smoke \
            --environment-label github-hosted-ci \
            --output .runtime/ci/agent-redis-load-smoke.json

      - name: Run authenticated Agent API E2E load smoke
        run: |
          python scripts/run_agent_api_e2e_load.py \
            --profile ci-smoke \
            --environment-label github-hosted-ci \
            --output .runtime/ci/agent-api-e2e-load-smoke.json

      - name: Upload Redis runtime and load evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: redis-runtime-acceptance-${{ github.run_id }}
          path: |
            .runtime/ci/redis-runtime-acceptance.xml
            .runtime/ci/agent-redis-load-smoke.json
            .runtime/ci/agent-api-e2e-load-smoke.json
          if-no-files-found: error
          retention-days: 14

  dependency-resolution:
    name: Resolve ${{ matrix.component }} lock
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        component:
          - agent
          - dagster
          - datahub
          - dbt
          - mcp
          - metricflow-compat
          - rag
          - serving
          - streaming
          - ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Resolve deterministic hash lock
        env:
          LOCK_OUTPUT_DIR: .ci-locks
        run: ./scripts/lock_dependencies.sh "${{ matrix.component }}"

      - name: Verify hashes exist
        shell: bash
        run: grep -q -- '--hash=sha256:' ".ci-locks/${{ matrix.component }}-py311-linux.lock.txt"
