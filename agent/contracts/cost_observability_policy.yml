version: 1
contract: governed_agent_cost_observability
mode: measured_units_without_fake_pricing

principles:
  tenant_id_is_trace_dimension: true
  bearer_token_is_never_logged: true
  context_estimated_tokens_are_recorded: true
  tool_result_count_is_recorded: true
  analysis_retry_usage_is_recorded: true
  total_latency_is_recorded: true
  provider_cost_is_unknown_until_reported: true
  no_hardcoded_model_price_without_provider_usage: true
  cost_per_answer_requires_actual_priced_usage: true

future_usage_sources:
  - llm_provider_input_output_tokens
  - embedding_tokens
  - reranker_calls
  - trino_bytes_scanned
  - vector_search_calls
  - external_api_calls
  - cache_hits
