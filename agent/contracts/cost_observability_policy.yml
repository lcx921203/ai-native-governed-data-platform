version: 2
contract: governed_agent_cost_observability
mode: measured_provider_usage_and_governed_pricing

principles:
  tenant_id_is_trace_dimension: true
  bearer_token_is_never_logged: true
  context_estimated_tokens_are_recorded: true
  tool_result_count_is_recorded: true
  analysis_retry_usage_is_recorded: true
  total_latency_is_recorded: true

  provider_usage_is_recorded_when_available: true
  cached_and_cache_write_tokens_are_distinguished: true
  pricing_catalog_is_versioned: true
  unknown_pricing_is_not_zero_cost: true
  cost_per_answer_requires_validated_answer: true

future_usage_sources:
  - embedding_tokens
  - reranker_calls
  - trino_bytes_scanned
  - vector_search_calls
  - external_api_calls
  - cache_hits
