version: 1
contract: commerce_agent_answer_policy
mode: evidence_first_pre_provider

principles:
  tool_results_are_not_final_answers: true
  claim_ledger_required: true
  renderer_has_no_tool_access: true
  renderer_has_no_sql_access: true
  renderer_must_declare_claim_ids: true
  static_contract_is_not_runtime_observation: true
  preserve_non_final_limitations: true

evidence:
  allowed_levels:
    - STATIC_CONTRACT
    - RUNTIME_VERIFIED
    - DEFERRED
  runtime_observation_requires: RUNTIME_VERIFIED

limits:
  max_claims: 20
  max_renderer_claims: 8

status_policy:
  ANSWERED: may_render
  PARTIAL: render_with_limitation
  NEEDS_DISCOVERY: ask_or_explain_discovery_gap
  DEFERRED: render_static_contract_only_and_state_runtime_gap
  BLOCKED: explain_boundary_only
  ERROR: fail_closed
