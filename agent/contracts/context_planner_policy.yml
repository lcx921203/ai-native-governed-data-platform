version: 3
contract: governed_context_planner
mode: route_driven_minimal_context

principles:
  route_before_context_planning: true
  minimal_runtime_context: true
  router_intent_must_not_be_reclassified: true
  context_planner_has_no_query_execution: true
  context_planner_has_no_metric_definition_authority: true
  unknown_intent_fail_closed: true
  analysis_requires_semantic_and_skill_context: true
  optional_code_context_is_progressive_expansion_only: true

defaults:
  max_items: 5

# Context Planner 只消费 Router 已经确定的 Intent。
# required Context 默认加载；optional Context 只有在前一级证据不足时才逐级扩展。
intent_context:

  METRIC_QUERY:
    - source: semantic
      required: true
      max_items: 3
      reason: >
        指标查询必须使用受治理 Metric / Dimension / Business Time；
        Agent 不允许自己重新定义指标公式。

  METRIC_DEFINITION:
    - source: semantic
      required: true
      max_items: 3
      reason: >
        指标定义必须来自当前受治理 dbt / MetricFlow 语义。

  ANALYSIS:
    - source: semantic
      required: true
      max_items: 6
      reason: >
        分析任务首先需要受治理 Metric / Dimension / Business Time，
        Skill 只能引用这些语义，不能重新定义指标公式或 Join 口径。

    - source: skill
      required: true
      max_items: 1
      reason: >
        分析路径必须由一个明确命中的 ACTIVE Analytics Skill 提供；
        没有 Skill 时 Fail Closed，不允许 LLM 临场发明分析流程。

    - source: code
      required: false
      max_items: 2
      reason: >
        只有 Semantic + Skill 无法解释底层模型具体转换行为时，
        才允许渐进式加载 Model Context Card；不能默认读取完整 dbt SQL。

  DIMENSION_VALUE_DISCOVERY:
    - source: semantic
      required: true
      max_items: 5
      reason: >
        Dimension Value 必须位于已经验证的 Metric Semantic Path 中。

  DATASET_GOVERNANCE:
    - source: metadata
      required: true
      max_items: 5
      reason: >
        Dataset Identity、Owner、Domain、Classification 等由 Metadata Authority 提供。

  DATASET_CONTEXT:
    - source: metadata
      required: true
      max_items: 5
      reason: >
        Dataset Context 由受治理 Metadata Authority 提供。

  ENTITY_CONTEXT:
    - source: metadata
      required: true
      max_items: 5
      reason: >
        Entity 定义与 Semantic Model 参与关系从受治理 Metadata Context 获取。

  LINEAGE_QUERY:
    - source: metadata
      required: true
      max_items: 5
      reason: >
        Lineage 首先从 DataHub / 当前受治理静态 Lineage 获取。

    - source: code
      required: false
      max_items: 2
      reason: >
        Metadata Lineage 无法解释具体转换逻辑时，才加载 Model Context Card；
        Card 仍不足时才允许显式读取有限 Raw Code 片段。

  RUNTIME_DIAGNOSIS:
    - source: metadata
      required: true
      max_items: 3
      reason: >
        Runtime Diagnosis 必须先确认准确 Dataset Identity。

    - source: runtime
      required: true
      max_items: 5
      reason: >
        Run、Freshness、Partition Completeness 等运行事实只能来自 Runtime Authority。

  METADATA_DISCOVERY:
    - source: metadata
      required: true
      max_items: 10
      reason: >
        无法确定目标时只能搜索受治理 Metadata Registry，不能由 LLM 自动猜目标。

  METADATA_SEARCH:
    - source: metadata
      required: true
      max_items: 10
      reason: >
        无法确定目标时只能搜索受治理 Metadata Registry，不能由 LLM 自动猜目标。

  KNOWLEDGE_QUERY:
    - source: knowledge
      required: true
      max_items: 3
      reason: >
        Knowledge Query 只能读取 Router 已批准 scope 下的 Governed Knowledge Corpus。

  KNOWLEDGE_RUNBOOK:
    - source: knowledge
      required: true
      max_items: 3
      reason: >
        Runbook 问题由 Governed Knowledge Corpus 提供解释证据。

  KNOWLEDGE_DESIGN:
    - source: knowledge
      required: true
      max_items: 3
      reason: >
        架构与设计决策从受治理 Knowledge Corpus 获取。

  KNOWLEDGE_GLOSSARY:
    - source: knowledge
      required: true
      max_items: 3
      reason: >
        业务术语解释从受治理 Knowledge Corpus 获取。
