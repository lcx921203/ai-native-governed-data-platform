version: 5
contract: governed_agent_slo_calibration
status: LAB_EVIDENCE_ONLY

principles:
  measured_sli_is_not_automatically_slo: true
  github_hosted_runner_is_not_production_slo_authority: true

  redis_admission_benchmark_is_not_end_to_end_agent_slo: true
  authenticated_api_e2e_benchmark_is_not_production_slo: true
  api_e2e_ci_uses_real_loopback_http: true
  api_e2e_ci_uses_real_rs256_jwt_verification: true
  api_e2e_ci_uses_real_request_context_mapping: true
  api_e2e_ci_uses_real_redis_admission: true
  api_e2e_ci_uses_real_governed_runtime: true
  api_e2e_ci_uses_deterministic_renderer: true
  api_e2e_ci_excludes_live_llm_and_external_query_engines: true

  # V3：HTTP Total -> Runtime -> Top-level Stage。
  api_e2e_records_internal_runtime_stage_latency: true
  api_e2e_stage_timing_comes_from_internal_audit: true
  raw_audit_is_not_uploaded_as_load_evidence: true
  public_agent_api_does_not_expose_stage_timing: true
  http_outside_runtime_is_residual_not_single_component_latency: true
  runtime_unattributed_is_residual_not_single_component_latency: true

  # V4：继续拆 Context Loader / Executor，但保持可加和，避免 Parent + Child 双计时。
  context_loader_substage_latency_is_recorded: true
  executor_substage_latency_is_recorded: true
  decomposed_parent_is_replaced_by_children_plus_residual: true
  hierarchical_substage_labels_are_bounded: true
  substage_latency_is_diagnostic_not_latency_gate: true

  # V5：拆 HTTP Outside Runtime，区分认证、Admission、线程调度、Runtime 后置 Audit 与 Server Residual。
  api_outside_runtime_phase_latency_is_recorded: true
  api_server_total_comes_from_pure_asgi_middleware: true
  api_timing_audit_is_written_after_response_send: true
  runtime_post_observer_audit_is_explicit_phase: true
  api_server_unattributed_is_residual_not_single_component: true
  client_after_server_is_residual_not_single_component: true
  api_phase_timing_is_internal_only: true

  ci_load_smoke_is_correctness_gate_not_latency_gate: true
  performance_percentiles_are_recorded_as_evidence: true
  benchmark_report_never_contains_redis_url_or_credentials: true
  benchmark_report_never_contains_bearer_token_or_prompt: true
  benchmark_report_never_contains_jwks_private_key: true
  benchmark_report_never_contains_raw_trace_ids: true

  guardrail_promotion_requires_representative_staging_evidence: true
  guardrail_promotion_requires_repeated_runs: true
  guardrail_promotion_requires_human_review: true

evidence:
  schema_version: 3
  calibration_status: LAB_OBSERVED_NOT_PROMOTED

  kinds:
    redis_admission:
      kind: REDIS_ADMISSION_LOAD_OBSERVATION
      scope: redis_admission_layer
    authenticated_agent_api_e2e:
      kind: AUTHENTICATED_AGENT_API_E2E_LOAD_OBSERVATION
      scope: loopback_http_jwt_request_context_redis_runtime_renderer_validator

  required_metrics:
    - attempts
    - admitted_or_http_status_counts
    - rejection_counts
    - unexpected_error_count
    - duration_seconds
    - attempts_per_second
    - http_total_p50_p95_p99_max
    - runtime_total_p50_p95_p99_max
    - runtime_stage_p50_p95_p99_max
    - context_loader_substage_p50_p95_p99_max
    - executor_substage_p50_p95_p99_max
    - http_outside_runtime_p50_p95_p99_max
    - runtime_unattributed_p50_p95_p99_max
    - api_server_total_p50_p95_p99_max
    - api_phase_p50_p95_p99_max
    - api_server_unattributed_p50_p95_p99_max
    - client_after_server_residual_p50_p95_p99_max
    - stage_timing_coverage
    - api_timing_coverage

profiles:
  ci_smoke:
    purpose: redis_admission_correctness_under_bounded_load
    latency_gate: false
    production_slo_authority: false

  api_e2e_ci_smoke:
    purpose: authenticated_agent_api_correctness_and_outside_runtime_breakdown_under_bounded_load
    latency_gate: false
    production_slo_authority: false
    live_llm: false
    live_metricflow: false
    live_trino: false
    audit_mode: jsonl_fail_closed
    api_phase_timing_mode: audit

  lab:
    purpose: repeatable_redis_admission_layer_baseline
    latency_gate: false
    production_slo_authority: false

  api_e2e_lab:
    purpose: repeatable_authenticated_agent_api_outside_runtime_breakdown_baseline
    latency_gate: false
    production_slo_authority: false
    live_llm: false
    live_metricflow: false
    live_trino: false
    audit_mode: jsonl_fail_closed
    api_phase_timing_mode: audit

promotion:
  current_production_slo_status: UNCALIBRATED
  required_before_promotion:
    - representative_staging_topology
    - representative_agent_runtime_mix
    - representative_llm_and_tool_latency
    - representative_tenant_and_subject_cardinality
    - repeated_load_runs
    - percentile_and_error_budget_review
    - explicit_human_approval
  minimum_repeated_runs: 3
  overwrite_initial_guardrail_without_versioned_evidence: forbidden
