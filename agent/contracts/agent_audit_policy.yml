version: 4
contract: governed_agent_runtime_audit
mode: append_only_structured_audit

principles:
  raw_question_not_persisted: true
  answer_text_not_persisted: true
  bearer_token_not_persisted: true
  jwt_claim_blob_not_persisted: true
  provider_raw_response_not_persisted: true
  internal_warning_text_not_persisted: true

  tenant_and_subject_are_audit_dimensions: true
  route_and_authorization_status_are_recorded: true
  trace_id_is_primary_correlation_key: true
  cost_and_usage_are_recorded: true

  structured_stage_timing_is_recorded: true
  hierarchical_substage_timing_is_recorded: true
  context_loader_substages_are_internal_only: true
  executor_substages_are_internal_only: true
  substage_name_never_contains_prompt_or_payload: true
  stage_timing_detail_is_not_persisted: true
  stage_timing_is_internal_observability_not_public_api: true

  decomposed_parent_is_not_double_counted: true
  decomposed_stage_has_unattributed_residual: true

  production_audit_failure_fails_closed: true
  library_default_is_disabled_for_tests_and_local_tools: true
  public_agent_api_does_not_expose_audit_query: true

  # V4：性能优化仍然保持“返回成功前已持久化”的安全边界。
  acknowledged_runtime_audit_is_durable: true
  asynchronous_fire_and_forget_is_not_used_for_fail_closed_runtime_audit: true
  concurrent_records_can_share_one_durable_sync: true
  durable_group_commit_preserves_per_record_ack: true
  durable_sync_failure_fails_all_waiting_records: true

  # 一个进程复用 FD，减少 open/close 系统调用；只缓存 File Handle，不缓存业务 Payload。
  process_reuses_one_append_fd_per_audit_path: true
  audit_payload_is_not_cached_in_memory_after_write: true

  # 文件首次创建后持久化 Parent Directory Entry。
  first_file_creation_fsyncs_parent_directory: true

  # Persistent FD 与 rename-and-replace rotation 的边界必须显式。
  rotation_requires_copytruncate_or_process_restart: true

runtime:
  mode_env: AGENT_AUDIT_MODE
  allowed_modes: [disabled, jsonl]
  default_mode: disabled

  path_env: AGENT_AUDIT_PATH
  default_path: .runtime/agent/audit.jsonl

  failure_mode_env: AGENT_AUDIT_FAILURE_MODE
  default_failure_mode: fail_closed

  group_commit_window_ms_env: AGENT_AUDIT_GROUP_COMMIT_WINDOW_MS
  default_group_commit_window_ms: 1.0
  max_group_commit_window_ms: 5.0

storage:
  format: jsonl
  file_mode: "0600"
  append_only: true

  durability_mode: synchronous_group_commit
  durable_sync_primitive: fdatasync_or_fsync
  acknowledged_record_requires_durable_sync: true
  one_write_syscall_per_record: true
  one_persistent_fd_per_process_and_path: true

  rotation_strategy: copytruncate_or_process_restart
  rename_and_replace_requires_process_restart: true

query:
  max_results: 1000
