  semantic_runtime: {path: .runtime/evidence/phase7a/agent_semantic_runtime.json, status: AGENT_SEMANTIC_RUNTIME_CUTOVER_VERIFIED}
  dagster_operational: {path: .runtime/evidence/phase7a/dagster_operational_runtime.json, status: DAGSTER_OPERATIONAL_RUNTIME_VERIFIED}
  openai_agent: {path: .runtime/evidence/phase7a/openai_agent_runtime.json, status: OPENAI_AGENT_RUNTIME_VERIFIED}
  knowledge_index: {path: .runtime/evidence/phase7b/knowledge_index.json, status: KNOWLEDGE_INDEX_RUNTIME_VERIFIED}
  knowledge_retrieval: {path: .runtime/evidence/phase7b/knowledge_retrieval.json, status: KNOWLEDGE_RETRIEVAL_RUNTIME_VERIFIED}
