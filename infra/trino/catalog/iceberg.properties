# Trino Serving catalog — Iceberg + Polaris REST Catalog + RustFS S3-compatible storage.
# Metric definitions are NOT owned here; Trino only queries already governed Lakehouse/Serving tables.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=${ENV:POLARIS_CATALOG_NAME}
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_CLIENT_ID}:${ENV:POLARIS_CLIENT_SECRET}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.rest-catalog.oauth2.server-uri=http://polaris:8181/api/catalog/v1/oauth/tokens
iceberg.rest-catalog.vended-credentials-enabled=true
iceberg.rest-catalog.http-headers=Polaris-Realm:${ENV:POLARIS_REALM}

# Trino 483 native S3 file system. The endpoint/path-style settings are required for local RustFS.
fs.s3.enabled=true
s3.endpoint=http://rustfs:9000
s3.region=${ENV:S3_REGION}
s3.path-style-access=true
s3.aws-access-key=${ENV:RUSTFS_ACCESS_KEY}
s3.aws-secret-key=${ENV:RUSTFS_SECRET_KEY}
