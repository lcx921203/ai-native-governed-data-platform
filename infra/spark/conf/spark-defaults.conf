# Local runtime-validation baseline.
#
# Pinned against the Apache Polaris 1.7.0 RustFS/Spark guide family:
#   Spark 3.5.x + Scala 2.12
#   Iceberg 1.10.1
#
# Local-learning only. The root credential below mirrors the official
# quickstart style and must not be reused in a production environment.

spark.master                                  local[*]
spark.app.name                                commerce-modern-data-platform
spark.sql.session.timeZone                    UTC

# Keep Maven/Ivy downloads in the writable cache volume used by docker-compose.
spark.jars.ivy                                /tmp/.ivy2
spark.jars.packages                           org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.10.1

spark.sql.extensions                          org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.polaris                     org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.polaris.type                rest
spark.sql.catalog.polaris.uri                 http://polaris:8181/api/catalog
spark.sql.catalog.polaris.warehouse           commerce_catalog
spark.sql.catalog.polaris.credential          root:s3cr3t
spark.sql.catalog.polaris.scope               PRINCIPAL_ROLE:ALL
spark.sql.catalog.polaris.header.X-Iceberg-Access-Delegation vended-credentials
spark.sql.catalog.polaris.token-refresh-enabled false
spark.sql.defaultCatalog                      polaris

# Thrift Server local development defaults.
spark.sql.hive.thriftServer.singleSession     true
